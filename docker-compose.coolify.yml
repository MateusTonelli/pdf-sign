services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pdfsign}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pdfsign}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CRYPTO_SECRET: ${APP_CRYPTO_SECRET}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      APP_STORAGE_PATH: /data/storage
      SPRING_MAIL_HOST: ${SMTP_HOST:-localhost}
      SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      APP_MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      APP_MAIL_LOG_ONLY: ${APP_MAIL_LOG_ONLY:-true}
    volumes:
      - pdf_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdfsign}
      POSTGRES_USER: ${POSTGRES_USER:-pdfsign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Published for local MCP / tooling on the LAN (not for public internet)
    ports:
      - "5432:5432"
    expose:
      - "5432"

volumes:
  pg_data:
  pdf_storage:
