services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdfsign
      POSTGRES_USER: pdfsign
      POSTGRES_PASSWORD: pdfsign
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfsign -d pdfsign"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pg_data_dev:
