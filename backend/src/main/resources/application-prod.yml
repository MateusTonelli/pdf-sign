spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  datasource:
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      maximum-pool-size: 10

app:
  mail:
    log-only: ${APP_MAIL_LOG_ONLY:true}

logging:
  level:
    root: INFO
    com.pdfsign: DEBUG
    org.springframework.security: WARN
    org.hibernate.tool.schema: DEBUG
    org.flywaydb: DEBUG
