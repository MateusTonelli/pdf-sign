# Optional local profile without Postgres: SPRING_PROFILES_ACTIVE=h2,dev
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:pdfsign;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
