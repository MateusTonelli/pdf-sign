spring:
  application:
    name: pdf-sign
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pdfsign}
    username: ${SPRING_DATASOURCE_USERNAME:pdfsign}
    password: ${SPRING_DATASOURCE_PASSWORD:pdfsign}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-use-at-least-32-chars!!}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:2592000000}
  crypto:
    secret: ${APP_CRYPTO_SECRET:change-me-crypto-32-bytes-minimum!!}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  storage-path: ${APP_STORAGE_PATH:./storage}
  magic-token-ttl-days: ${APP_MAGIC_TOKEN_TTL_DAYS:7}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  mail:
    from: ${APP_MAIL_FROM:noreply@pdfsign.local}
    log-only: ${APP_MAIL_LOG_ONLY:false}
